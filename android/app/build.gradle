plugins {
    id "com.android.application"
}

def setting = { String propertyName, String environmentName, String fallback ->
    providers.gradleProperty(propertyName)
        .orElse(providers.environmentVariable(environmentName))
        .orElse(fallback)
        .get()
}
def javaString = { String value -> "\"${value.replace("\\", "\\\\").replace("\"", "\\\"")}\"" }
def signingFile = file(setting("wittSigningProperties", "WITT_SIGNING_PROPERTIES", "signing.properties"))
def webUrl = setting("wittWebUrl", "WITT_WEB_URL", "https://witt.example.com/vault/index.html")
def apiUrl = setting("wittApiUrl", "WITT_API_URL", "https://witt.example.com/vault-api/")
def updateUrl = setting("wittUpdateUrl", "WITT_UPDATE_URL", "https://witt.example.com/vault/update-osaka.json")
def fallbackWebUrl = setting("wittFallbackWebUrl", "WITT_FALLBACK_WEB_URL", "https://witt.example.com/vault/index.html")
def fallbackApiUrl = setting("wittFallbackApiUrl", "WITT_FALLBACK_API_URL", "https://witt.example.com/vault-api/")
def signing = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace "com.codevibe.dropvault"
    compileSdk 35

    defaultConfig {
        applicationId setting("wittApplicationId", "WITT_APPLICATION_ID", "com.codevibe.dropvault.osaka")
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(setting("wittVersionCode", "WITT_VERSION_CODE", "46"))
        versionName setting("wittVersionName", "WITT_VERSION_NAME", "2.2.27")
        buildConfigField "boolean", "OPEN_ACCESS", Boolean.parseBoolean(setting("wittOpenAccess", "WITT_OPEN_ACCESS", "false")).toString()
        manifestPlaceholders = [wittAppLabel: setting("wittAppLabel", "WITT_APP_LABEL", "Witt 大阪")]
        buildConfigField "String", "WEB_URL", javaString(webUrl)
        buildConfigField "String", "API_URL", javaString(apiUrl)
        buildConfigField "String", "UPDATE_URL", javaString(updateUrl)
        buildConfigField "String", "FALLBACK_WEB_URL", javaString(fallbackWebUrl)
        buildConfigField "String", "FALLBACK_API_URL", javaString(fallbackApiUrl)
    }

    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile file(signing.getProperty("storeFile"))
                storePassword signing.getProperty("storePassword")
                keyAlias signing.getProperty("keyAlias")
                keyPassword signing.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (signingFile.exists()) signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }
    packaging {
        resources {
            excludes += ["META-INF/versions/9/OSGI-INF/MANIFEST.MF"]
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.core:core:1.15.0"
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "com.github.mwiede:jsch:2.28.6"
}
