server {
    listen 443 ssl http2;
    server_name witt.example.com;

    ssl_certificate /etc/letsencrypt/live/witt.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/witt.example.com/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 500m;

    location ^~ /vault-api/ {
        proxy_pass http://127.0.0.1:3003/;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /vault/index.html {
        alias /var/www/witt/index.html;
        add_header Cache-Control "no-store" always;
    }

    location = /vault/update.json {
        alias /var/www/witt/update.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/vault/(.*\.apk)$ {
        alias /var/www/witt/$1;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
        expires 7d;
    }

    location ~ ^/vault/(.*\.(?:js|css|svg|png|webp|woff2|woff|ttf))$ {
        alias /var/www/witt/$1;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location /vault/ {
        alias /var/www/witt/;
        index index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        return 404;
    }
}
