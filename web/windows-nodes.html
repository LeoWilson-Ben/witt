<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Witt Windows 节点</title><style>body{margin:0;background:#10151c;color:#edf4f6;font:16px system-ui}.wrap{max-width:760px;margin:auto;padding:24px}button,textarea,input,select{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border-radius:8px;border:1px solid #394a5d;background:#17212c;color:inherit}button{background:#31816d;font-weight:700}.card{border:1px solid #34455a;padding:14px;border-radius:10px;margin:12px 0}pre{white-space:pre-wrap;background:#090d12;padding:12px;border-radius:7px;overflow:auto;max-height:320px}small{color:#aabac7}</style><main class=wrap><h1>Windows 工作节点</h1><p><small>模型任务在 Windows 本机执行。首次请从此页生成配对，再在 Windows 使用下载的脚本执行配对。</small></p><div class=card><h2>创建节点配对</h2><input id=label placeholder="Windows 设备名称"><p><small>脚本会自动建立 WireGuard 私有连接并安全同步 Stellarbit 配置。</small></p><button onclick=pair()>生成配对信息</button><pre id=pairing hidden></pre></div><h2>节点与任务</h2><div id=nodes>加载中…</div></main><script>const A='/vault-api/windows-nodes',q=id=>document.getElementById(id),e=s=>String(s).replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]));async function api(path,opt={}){let r=await fetch(A+path,{credentials:'same-origin',headers:{'content-type':'application/json'},...opt}),d=r.status===204?{}:await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}async function pair(){try{let d=await api('/pair',{method:'POST',body:JSON.stringify({label:q('label').value,})});q('pairing').hidden=false;q('pairing').textContent=`节点 ID: ${d.node.id}\n配对密钥: ${d.pairingToken}\n\nWindows 中运行：\npowershell -ExecutionPolicy Bypass -File .\\witt-windows-node.ps1 -Pair\n\n然后粘贴上述一次性配对密钥；脚本会自动完成私网接入和 Stellarbit 配置同步。`;load()}catch(x){alert(x.message)}}async function send(id){let prompt=q('p-'+id).value,provider=q('v-'+id).value,model=q('m-'+id).value;try{await api('/'+id+'/tasks',{method:'POST',body:JSON.stringify({prompt,provider,model})});q('o-'+id).textContent='已投递，等待 Windows 执行…';setTimeout(()=>tasks(id),4000)}catch(x){alert(x.message)}}async function tasks(id){let d=await api('/'+id+'/tasks'),t=d.tasks[0];q('o-'+id).innerHTML=t?`<small>${e(t.status)} · ${e(t.completedAt||t.createdAt)}</small><pre>${e(t.text||t.error||'暂无输出')}</pre>`:'暂无任务'}async function load(){try{let d=await api('');q('nodes').innerHTML=d.nodes.map(n=>`<div class=card><b>${e(n.label)}</b><br><small>${n.lastSeenAt?'最近连接：'+e(n.lastSeenAt):'尚未连接'}</small><select id="v-${n.id}"><option value=codex>GPT / Codex（Windows 本机）</option><option value=antigravity>Antigravity（Windows 本机）</option><option value=stellarbit>Stellarbit（Windows 直连）</option></select><input id="m-${n.id}" placeholder="可选模型名"><textarea id="p-${n.id}" placeholder="发送给 Windows 本机 AI 的任务"></textarea><button onclick="send('${n.id}')">在此 Windows 执行</button><div id="o-${n.id}"></div></div>`).join('')||'暂无节点'}catch(x){q('nodes').textContent=x.message}}load()</script></html>
