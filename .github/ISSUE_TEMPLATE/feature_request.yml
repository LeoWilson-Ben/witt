name: Feature request
description: 提议新的能力或体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 当前遇到什么问题？谁会受益？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: 安全与兼容性
      description: 是否影响认证、权限、数据格式、旧客户端或部署配置？
